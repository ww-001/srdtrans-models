name: Fetch SRDTrans models from Zenodo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-models.yml'

jobs:
  fetch-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Try downloading each known model file (no API dependency)
        run: |
          mkdir -p models
          set +e

          # Known filenames from the SRDTrans paper / Zenodo record layouts.
          # We try multiple candidates per record so that naming variations
          # (e.g. cad_03hz.pth vs cad_03hz_20.pth) all get covered.
          declare -a URLS=(
            # Calcium imaging (Zenodo record 7818030)
            "https://zenodo.org/records/7818030/files/cad_03hz.pth"
            "https://zenodo.org/records/7818030/files/cad_03hz_20.pth"
            "https://zenodo.org/records/7818030/files/cad_30hz.pth"
            "https://zenodo.org/records/7818030/files/cad_30hz_20.pth"
            "https://zenodo.org/record/7818030/files/cad_03hz.pth"
            "https://zenodo.org/record/7818030/files/cad_03hz_20.pth"
            "https://zenodo.org/record/7818030/files/cad_30hz.pth"
            "https://zenodo.org/record/7818030/files/cad_30hz_20.pth"
            # SMLM (Zenodo record 8332544)
            "https://zenodo.org/records/8332544/files/smlm.pth"
            "https://zenodo.org/record/8332544/files/smlm.pth"
            "https://zenodo.org/records/8332544/files/SMLM.pth"
            "https://zenodo.org/record/8332544/files/SMLM.pth"
          )

          ok=0
          for url in "${URLS[@]}"; do
            fname=$(basename "$url")
            echo ">>> Trying $fname"
            if curl -fsSL --retry 5 --retry-delay 10 --retry-connrefused \
                 --connect-timeout 30 --max-time 600 \
                 -o "models/$fname" "$url" 2>/dev/null; then
              size=$(stat -c%s "models/$fname" 2>/dev/null || echo 0)
              if [ "$size" -gt 1000 ]; then
                echo "    OK $(numfmt --to=iec --suffix=B $size 2>/dev/null || echo $size bytes)"
                ok=$((ok + 1))
              else
                echo "    TOO SMALL ($size bytes), removing"
                rm -f "models/$fname"
              fi
            else
              echo "    not found (404 or transient error)"
            fi
          done

          echo ""
          echo ">>> Downloaded: $ok files"
          ls -lh models/
          if [ $ok -eq 0 ]; then
            echo "::error::No models downloaded. Zenodo may be blocking GitHub Actions IPs entirely."
            exit 1
          fi

      - name: Verify checkpoints are valid PyTorch state_dicts
        run: |
          python3 - << 'PY'
          import torch, os, sys
          ok = True
          for f in sorted(os.listdir('models')):
              path = f'models/{f}'
              size_mb = os.path.getsize(path) / 1024 / 1024
              try:
                  sd = torch.load(path, map_location='cpu', weights_only=True)
                  print(f'  {f}: {len(sd)} tensors, {size_mb:.1f} MB  OK')
              except Exception as e:
                  print(f'  {f}: VERIFY FAILED -> {e}')
                  ok = False
          sys.exit(0 if ok else 1)
          PY

      - name: Upload models as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: srdtrans-models
          path: models/
          if-no-files-found: error
          retention-days: 30